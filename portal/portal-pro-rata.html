<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Pro Rata</title>
<style>
  /* Cores extraídas do logo helppi.me */
  :root { --brand:#f87101; --accent:#7c3aed; --bg:#000; --card:#111114; --text:#fff; --muted:#a1a1aa; --line:#ffffff2a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f5f7; --card:#fff; --text:#18181b; --muted:#6b6b76; --line:#0002; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { background:#000; border-bottom:2px solid var(--brand); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; }
  header img { height:40px; } header img[src=""] { display:none; }
  header b { font-size:1rem; flex:1; color:var(--muted); font-weight:500; }
  header button { background:#fff3; color:#fff; border:0; padding:6px 12px; border-radius:6px; cursor:pointer; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); padding:20px; border-radius:12px; box-shadow:0 2px 12px #0001; margin-bottom:16px; }
  .login { max-width:380px; margin:40px auto; }
  h1,h2 { margin:0 0 12px; font-size:1.2rem; }
  label { display:block; margin:10px 0 4px; font-size:.85rem; color:var(--muted); }
  input:focus,select:focus { outline:2px solid var(--accent); }
  select option { color:#000; }
  input,select { padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; width:100%; }
  .btn { padding:9px 16px; border:0; border-radius:8px; background:var(--brand); color:#000; font-weight:600; font:inherit; cursor:pointer; margin-top:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .tw { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th,td { padding:6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  td input { min-width:90px; } td select { min-width:120px; } td.n { text-align:right; }
  tfoot td { font-weight:700; color:var(--brand); } .erro { color:#d33; margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>

<script>// Lógica pro rata de endossos (baseada na planilha "Base para cálculos")
// dias = data do endosso - vigência inicial
// custo dia = valor inicial / 365
// custo devido = custo dia * dias
// valor = valor inicial - custo devido (negativo em exclusões = estorno)
// comissão = valor * % comissão
const BASE_DIAS = 365;

function diasEntre(vigencia, data) {
  const ms = Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()) -
             Date.UTC(vigencia.getFullYear(), vigencia.getMonth(), vigencia.getDate());
  return Math.round(ms / 86400000);
}

function calcularEndosso({ vigencia, data, valorInicial, comissao, tipo }) {
  const dias = diasEntre(vigencia, data);
  if (dias < 0) throw new Error("A data do endosso é anterior à vigência inicial.");
  if (dias > BASE_DIAS) throw new Error("A data do endosso passa de 365 dias da vigência.");
  const custoDia = valorInicial / BASE_DIAS;
  const custoDevido = custoDia * dias;
  let valor = valorInicial - custoDevido;
  if (tipo === "EXCLUSÃO") valor = -valor;
  return { dias, custoDia, custoDevido, valor, comissao: valor * comissao };
}

//if (typeof module !== "undefined") module.exports = { diasEntre, calcularEndosso };
</script>
<script>
  // ATENÇÃO: login apenas demonstrativo (client-side). Não oferece segurança real.
  const USUARIOS = { admin: "1234" };
  const $ = id => document.getElementById(id);
  const brl = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

  function mostrar(logado) { $("login").hidden = logado; $("calc").hidden = !logado; $("sair").hidden = !logado; }
  mostrar(sessionStorage.getItem("logado") === "1");
  $("fLogin").onsubmit = e => {
    e.preventDefault();
    if (USUARIOS[$("user").value] === $("pass").value) { sessionStorage.setItem("logado","1"); mostrar(true); }
    else $("erroLogin").textContent = "Usuário ou senha inválidos.";
  };
  $("sair").onclick = () => { sessionStorage.removeItem("logado"); mostrar(false); };

  const campos = `<td><input class="mm"></td><td><input class="pl"></td><td><input class="ch"></td><td><input class="np"></td><td><input class="ne"></td>
    <td><select class="tp"><option>INCLUSÃO</option><option>EXCLUSÃO</option></select></td>
    <td><input class="dt" type="date"></td><td><input class="vi" type="number" step="0.01" min="0"></td>
    <td class="n r-dias">-</td><td class="n r-cd">-</td><td class="n r-dev">-</td><td class="n r-val">-</td><td class="n r-com">-</td>
    <td><button class="x" title="Remover">✕</button></td>`;
  function addLinha() {
    const tr = document.createElement("tr"); tr.innerHTML = campos; $("linhas").appendChild(tr);
    tr.querySelector(".x").onclick = () => { tr.remove(); recalcular(); };
  }
  function recalcular() {
    $("erroCalc").textContent = "";
    let tv = 0, tc = 0, erro = "";
    const vig = $("vig").value ? parse($("vig").value) : null;
    const pct = (parseFloat($("com").value) || 0) / 100;
    for (const tr of $("linhas").children) {
      const q = s => tr.querySelector(s), data = q(".dt").value, vi = parseFloat(q(".vi").value);
      const set = (a,b,c,d,e) => { q(".r-dias").textContent=a; q(".r-cd").textContent=b; q(".r-dev").textContent=c; q(".r-val").textContent=d; q(".r-com").textContent=e; };
      if (!vig || !data || isNaN(vi)) { set("-","-","-","-","-"); continue; }
      try {
        const r = calcularEndosso({ vigencia: vig, data: parse(data), valorInicial: vi, comissao: pct, tipo: q(".tp").value });
        set(r.dias, brl(r.custoDia), brl(r.custoDevido), brl(r.valor), brl(r.comissao));
        tv += r.valor; tc += r.comissao;
      } catch (e) { set("-","-","-","-","-"); erro = e.message; }
    }
    $("tV").textContent = brl(tv); $("tC").textContent = brl(tc); $("erroCalc").textContent = erro;
  }
  $("add").onclick = addLinha;
  $("calc").addEventListener("input", recalcular);
  addLinha();
</script>
